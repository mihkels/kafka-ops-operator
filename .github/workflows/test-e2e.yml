name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Build Docker image for e2e tests
        run: |
          # Use single platform for local loading in e2e tests
          DOCKER_PLATFORMS=linux/amd64 make docker-build

      - name: Load image into kind cluster
        run: |
          IMG_LINE=$(grep "^IMG ?=" Makefile | head -1)
          FULL_IMAGE=$(echo "$IMG_LINE" | cut -d'=' -f2 | tr -d ' ')
          kind load docker-image $FULL_IMAGE

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
