name: Publish

on:
  workflow_run:
    workflows: ["Tests", "Lint", "E2E Tests"]
    types:
      - completed

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: mihkels/kafka-ops-operator

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm  # Native ARM64 runner!
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Extract version and image from Makefile
        id: extract-version
        run: |
          IMG_LINE=$(grep "^IMG ?=" Makefile | head -1)
          FULL_IMAGE=$(echo "$IMG_LINE" | cut -d'=' -f2 | tr -d ' ')
          VERSION=$(echo "$FULL_IMAGE" | cut -d':' -f2)
          IMAGE_NAME=$(echo "$FULL_IMAGE" | cut -d':' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      # No QEMU needed for native ARM64 runner!
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        timeout-minutes: 20  # Much shorter timeout since no emulation!
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: --progress=plain

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version and image from Makefile
        id: extract-version
        run: |
          IMG_LINE=$(grep "^IMG ?=" Makefile | head -1)
          FULL_IMAGE=$(echo "$IMG_LINE" | cut -d'=' -f2 | tr -d ' ')
          VERSION=$(echo "$FULL_IMAGE" | cut -d':' -f2)
          IMAGE_NAME=$(echo "$FULL_IMAGE" | cut -d':' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.extract-version.outputs.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ steps.extract-version.outputs.image }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ steps.extract-version.outputs.image }}

  # Helm chart publish
  publish-helm-chart:
    runs-on: ubuntu-latest
    needs: merge
    if: success()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.1'

      - name: Log in to Docker Hub (for Helm OCI)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Package and publish Helm chart
        run: |
          cd helm-charts/kafka-ops-operator
          helm dependency update .
          helm package .
          helm push kafka-ops-operator-*.tgz oci://${{ env.REGISTRY }}/mihkels

      - name: Verify chart publication
        run: |
          echo "Chart published to: oci://${{ env.REGISTRY }}/mihkels/kafka-ops-operator"