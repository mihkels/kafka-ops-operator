name: Publish

on:
  workflow_run:
    workflows: ["Tests", "Lint", "E2E Tests"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest-arm
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15  # Set overall job timeout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker with containerd image store for better performance
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Extract version and image from Makefile
        id: extract-version
        run: |
          IMG_LINE=$(grep "^IMG ?=" Makefile | head -1)
          FULL_IMAGE=$(echo "$IMG_LINE" | cut -d'=' -f2 | tr -d ' ')
          VERSION=$(echo "$FULL_IMAGE" | cut -d':' -f2)
          IMAGE_NAME=$(echo "$FULL_IMAGE" | cut -d':' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.extract-version.outputs.image-name }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        timeout-minutes: 45  # Increased timeout for the build step
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.extract-version.outputs.image }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=gha
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-new,mode=max
            type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Move cache to prevent unlimited growth
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Helm chart publish
  publish-helm-chart:
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.1'

      - name: Log in to Docker Hub (for Helm OCI)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Package and publish Helm chart
        run: |
          cd helm-charts/kafka-ops-operator
          helm dependency update .
          helm package .
          helm push kafka-ops-operator-*.tgz oci://${{ env.REGISTRY }}/mihkels

      - name: Verify chart publication
        run: |
          echo "Chart published to: oci://${{ env.REGISTRY }}/mihkels/kafka-ops-operator"