name: Publish

on:
  workflow_run:
    workflows: ["Tests", "Lint", "E2E Tests"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Add QEMU setup step for ARM emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract version and image from Makefile
        id: extract-version
        run: |
          IMG_LINE=$(grep "^IMG ?=" Makefile | head -1)
          FULL_IMAGE=$(echo "$IMG_LINE" | cut -d'=' -f2 | tr -d ' ')
          VERSION=$(echo "$FULL_IMAGE" | cut -d':' -f2)
          IMAGE_NAME=$(echo "$FULL_IMAGE" | cut -d':' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        timeout-minutes: 15  # Set a timeout for the build step
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.extract-version.outputs.image }}
          build-args: --progress=plain

  # Helm chart publish
  publish-helm-chart:
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.1'

      - name: Log in to Docker Hub (for Helm OCI)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Package and publish Helm chart
        run: |
          cd helm-charts/kafka-ops-operator
          helm dependency update .
          helm package .
          helm push kafka-ops-operator-*.tgz oci://${{ env.REGISTRY }}/mihkels

      - name: Verify chart publication
        run: |
          echo "Chart published to: oci://${{ env.REGISTRY }}/mihkels/kafka-ops-operator"
          echo "Install with: helm install my-kafka-ops oci://${{ env.REGISTRY }}/mihkels/kafka-ops-operator --version ${{ needs.publish.outputs.version }}"