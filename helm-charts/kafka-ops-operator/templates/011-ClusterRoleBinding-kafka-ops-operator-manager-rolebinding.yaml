apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "kafka-ops-operator.labels" . | nindent 4 }}
  name: {{ include "kafka-ops-operator.fullname" . }}-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kafka-ops-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "kafka-ops-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
