    {{- include "kafka-ops-operator.labels" . | nindent 4 }}
  name: {{ include "kafka-ops-operator.fullname" . }}-metrics-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
