apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../crd
  - ../rbac
  - ../manager

patches:
  - target:
      kind: Deployment
      name: controller-manager
      namespace: system
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: kafka-system
  - target:
      kind: ClusterRoleBinding
      name: manager-rolebinding
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: kafka-system
  - target:
      kind: ClusterRoleBinding
      name: proxy-rolebinding
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: kafka-system